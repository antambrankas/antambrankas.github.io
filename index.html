<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Harga jual emas Brankas LM terbaru dalam tampilan ringkas dan mudah dibaca."
    />
    <meta name="theme-color" content="#f5f6f8" />
    <title>Harga Emas Brankas LM</title>
  </head>
  <body class="min-h-screen bg-canvas text-ink antialiased">
    <main class="mx-auto w-full max-w-2xl px-4 pb-5 pt-5 sm:px-6 sm:pt-7">
      <header>
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0">
            <p class="text-xs font-semibold uppercase tracking-[0.14em] text-gold-700">Brankas LM</p>
            <h1 class="mt-0.5 text-xl font-bold tracking-[-0.025em] text-ink sm:text-2xl">Harga Emas Hari Ini</h1>
          </div>

          <button
            id="refreshButton"
            type="button"
            class="grid size-10 shrink-0 place-items-center rounded-full border border-line bg-white text-ink shadow-sm transition hover:border-gold-300 hover:text-gold-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold-500 focus-visible:ring-offset-2 disabled:cursor-wait disabled:opacity-60"
            aria-label="Perbarui harga"
            title="Perbarui harga"
          >
            <svg id="refreshIcon" viewBox="0 0 24 24" class="size-4.5" aria-hidden="true">
              <path fill="currentColor" d="M17.65 6.35A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h8V3l-3.35 3.35Z"/>
            </svg>
            <span id="refreshText" class="sr-only">Perbarui harga</span>
          </button>
        </div>

        <div class="mt-2 flex items-center gap-1.5 text-xs text-muted">
          <svg viewBox="0 0 24 24" class="size-3.5 shrink-0" aria-hidden="true">
            <path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2Zm1 10.414 2.293 2.293-1.414 1.414L11 13.243V7h2Z"/>
          </svg>
          <span id="lastUpdated">Mengambil harga terbaru…</span>
        </div>
      </header>

      <section aria-label="Harga emas Brankas LM" class="mt-5">
        <div id="statusRegion" class="sr-only" role="status" aria-live="polite"></div>
        <div id="priceGrid" class="grid grid-cols-2 gap-3 sm:gap-4" aria-busy="true"></div>
      </section>

      <div class="mt-4 flex items-center justify-center gap-1.5 text-center text-[11px] leading-4 text-muted sm:text-xs">
        <span>Data</span>
        <a
          id="sourceLink"
          href="https://brankaslm.com"
          target="_blank"
          rel="noreferrer"
          class="font-semibold text-ink underline decoration-line underline-offset-3 transition hover:decoration-gold-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold-500"
        >Brankas LM</a>
        <span>• API pihak ketiga • Harga dapat berubah</span>
      </div>

      <p class="mt-1.5 text-center text-[10px] leading-4 text-muted/80 sm:text-[11px]">
        Bukan situs resmi ANTAM atau Brankas LM.
      </p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
